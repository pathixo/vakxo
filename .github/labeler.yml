# Configuration for actions/labeler@v5
# Documentation: https://github.com/actions/labeler

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "components/**"
          - "public/**"

components:
  - changed-files:
      - any-glob-to-any-file: "components/**"

pages:
  - changed-files:
      - any-glob-to-any-file: "app/**"

styles:
  - changed-files:
      - any-glob-to-any-file:
          - "app/globals.css"
          - "postcss.config.mjs"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"

